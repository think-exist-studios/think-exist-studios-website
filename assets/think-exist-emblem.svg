<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Think Exist emblem</title>
<desc id="desc">Cosmic metallic Think Exist studio emblem with concentric arcs, flowing lower bands, and a central four-point star.</desc>
<defs>
  <linearGradient id="cosmic" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f5f7ff"/>
    <stop offset=".18" stop-color="#aeb8ca"/>
    <stop offset=".34" stop-color="#6c37ff"/>
    <stop offset=".50" stop-color="#d34fff"/>
    <stop offset=".64" stop-color="#ff9c45"/>
    <stop offset=".78" stop-color="#f6d68c"/>
    <stop offset="1" stop-color="#d9e0ea"/>
  </linearGradient>
  <radialGradient id="core" cx=".5" cy=".46" r=".62">
    <stop offset="0" stop-color="#fff7cf"/>
    <stop offset=".12" stop-color="#ffbd65"/>
    <stop offset=".30" stop-color="#b14cff"/>
    <stop offset=".55" stop-color="#5526a7"/>
    <stop offset=".78" stop-color="#121326"/>
    <stop offset="1" stop-color="#05060b"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff4c6"/>
    <stop offset=".38" stop-color="#ffc66b"/>
    <stop offset=".68" stop-color="#d88b38"/>
    <stop offset="1" stop-color="#fff0b8"/>
  </linearGradient>
  <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".55"/>
  </filter>
</defs>

