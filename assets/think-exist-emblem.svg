<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
<title id="t">Think Exist emblem</title>
<desc id="d">Thin cosmic orbital emblem with three upper arcs, flowing lower waves, a central nebula ring and four-point star.</desc>
<defs>
  <linearGradient id="metal" x1=".05" y1=".08" x2=".95" y2=".92">
    <stop offset="0" stop-color="#fff5df"/>
    <stop offset=".14" stop-color="#f2d7ff"/>
    <stop offset=".32" stop-color="#8d63ff"/>
    <stop offset=".48" stop-color="#3d2a72"/>
    <stop offset=".63" stop-color="#ff6bd6"/>
    <stop offset=".78" stop-color="#ffb45d"/>
    <stop offset="1" stop-color="#fff3c9"/>
  </linearGradient>
  <linearGradient id="darkCosmic" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080b18"/>
    <stop offset=".35" stop-color="#1d143d"/>
    <stop offset=".58" stop-color="#61218d"/>
    <stop offset=".76" stop-color="#cf5b58"/>
    <stop offset="1" stop-color="#100d20"/>
  </linearGradient>
  <radialGradient id="neb" cx=".46" cy=".43" r=".72">
    <stop offset="0" stop-color="#ffd68d"/>
    <stop offset=".08" stop-color="#fff6df"/>
    <stop offset=".18" stop-color="#ff9f59"/>
    <stop offset=".35" stop-color="#c34cff"/>
    <stop offset=".58" stop-color="#4a2d9f"/>
    <stop offset=".82" stop-color="#17152f"/>
    <stop offset="1" stop-color="#070914"/>
  </radialGradient>
  <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="256" cy="256" r="208" stroke="url(#metal)" stroke-width="3.5" opacity=".95"/>
  <path d="M71 236 A188 188 0 0 1 441 236" stroke="url(#metal)" stroke-width="13"/>
  <path d="M110 231 A149 149 0 0 1 402 231" stroke="url(#darkCosmic)" stroke-width="16"/>
  <path d="M153 226 A106 106 0 0 1 359 226" stroke="url(#metal)" stroke-width="18"/>

  <path d="M45 269 C87 241 119 242 151 276 C186 313 215 328 256 328 C297 328 326 313 361 276 C393 242 425 241 467 269"
        stroke="url(#darkCosmic)" stroke-width="20"/>
  <path d="M60 295 C99 266 128 269 160 301 C192 334 219 347 256 347 C293 347 320 334 352 301 C384 269 413 266 452 295"
        stroke="url(#metal)" stroke-width="12"/>
  <path d="M81 322 C114 298 141 301 169 328 C197 355 221 365 256 365 C291 365 315 355 343 328 C371 301 398 298 431 322"
        stroke="url(#darkCosmic)" stroke-width="18"/>
</g>

<g filter="url(#glow)">
  <circle cx="256" cy="265" r="74" fill="url(#neb)" stroke="url(#metal)" stroke-width="6"/>
  <circle cx="256" cy="265" r="60" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.2"/>
  <path d="M256 216 C262 246 277 260 307 265 C277 271 262 285 256 315 C250 285 235 271 205 265 C235 260 250 246 256 216Z"
        fill="#fffef5" stroke="#ffd591" stroke-width="2"/>
</g>

